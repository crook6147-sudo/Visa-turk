<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تأشيرة تركيا 🇹🇷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 35px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .icon-box {
      font-size: 3rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* تصميم علامة توقف المرورية الاحترافية */
    .stop-sign {
      width: 70px;
      height: 70px;
      background: #dc2626;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 1px;
      border: 3px solid #ffffff;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
      margin: 0 auto 15px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #ef4444;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-main:active {
      background: #dc2626;
    }

    .prank-text {
      color: #f87171;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.8;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    /* أنيميشن الاختفاء والظهور التلقائي */
    .waiting-text {
      color: #f3e5ab;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.6;
      animation: pulseFade 2.5s infinite ease-in-out;
    }

    @keyframes pulseFade {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- صوت الموسيقى -->
  <audio id="bg-music" src="music.mp3" loop></audio>

  <div class="card">
    
    <!-- الصفحة الأولى -->
    <div id="page-1">
      <div class="icon-box">🇹🇷</div>
      <h1 class="title">جاهز لترى تأشيرة سفرك لتركيا؟</h1>
      <p class="subtitle">تمت معالجة وثيقة السفر بنجاح وهي جاهزة للعرض الآن.</p>
      <button class="btn-main" onclick="nextPage()">استعراض التأشيرة 📜</button>
    </div>

    <!-- الصفحة الثانية (المقلب) -->
    <div id="page-2" class="hidden">
      <!-- علامة STOP المرورية -->
      <div class="stop-sign">STOP</div>
      
      <h1 class="title" style="color: #ef4444;">ليس بهذه السهولة!</h1>
      <p class="prank-text">
        أرسل فيديو جديد للواتساب ترقص فيه مع أصدقائك لمدة دقيقتين مع أغنية "قسمة ونصيب" لكي ترى تأشيرة تركيا! 💃🕺
      </p>
      
      <!-- النص المتحرك بالأسفل -->
      <p class="waiting-text">
        * جاري انتظار استلام الفيديو لتأكيد فتح التأشيرة تلقائياً...
      </p>
    </div>

  </div>

  <script>
    function nextPage() {
      const music = document.getElementById('bg-music');
      if (music) { music.play(); }

      document.getElementById('page-1').classList.add('hidden');
      document.getElementById('page-2').classList.remove('hidden');
    }
  </script>

</body>
</html>
