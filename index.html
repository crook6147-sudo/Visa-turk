<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Tajawal:wght@300;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #090a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* كارت بساطة احترافي */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 45px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flag-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      display: inline-block;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 35px;
      font-weight: 300;
    }

    /* زر مودرن ناعم */
    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #ffffff;
      color: #090a0f;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* رسالة المقلب البسيطة */
    .prank-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 20px;
      padding: 25px 20px;
      margin-bottom: 10px;
    }

    .prank-text {
      color: #f87171;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- صوت الموسيقى -->
  <audio id="bg-music" src="music.mp3" loop></audio>

  <div class="card">
    
    <!-- الصفحة الأولى -->
    <div id="page-1">
      <div class="flag-icon">🇹🇷</div>
      <h1 class="title">جاهز لترى تأشيرة سفرك لتركيا؟</h1>
      <p class="subtitle">تمت معالجة وثيقة السفر بنجاح وهي جاهزة للعرض الآن.</p>
      <button class="btn-main" onclick="nextPage()">استعراض التأشيرة</button>
    </div>

    <!-- الصفحة الثانية (المقلب فقط) -->
    <div id="page-2" class="hidden">
      <div class="flag-icon">🛑</div>
      <h1 class="title" style="color: #f87171;">ليس بهذه السهولة!</h1>
      
      <div class="prank-box">
        <p class="prank-text">
          أرسل فيديو جديد للواتساب ترقص فيه مع أصدقائك لمدة دقيقتين مع أغنية "قسمة ونصيب" لكي ترى تأشيرة تركيا! 💃🕺
        </p>
      </div>
    </div>

  </div>

  <script>
    function nextPage() {
      // تشغيل الأغنية
      const music = document.getElementById('bg-music');
      if (music) { music.play(); }

      // الانتقال للصفحة الثانية
      document.getElementById('page-1').classList.add('hidden');
      document.getElementById('page-2').classList.remove('hidden');
    }
  </script>

</body>
</html>
